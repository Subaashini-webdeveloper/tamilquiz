<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short vs Long Vowel Quiz</title>
    <style>
        :root {
            --primary: #0066cc;
            --bg: #f4f4f4;
            --box-bg: #e9e9e9;
        }
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background: #fff; }
        .quiz-container { width: 100%; max-width: 800px; border: 1px solid #ddd; padding: 20px; border-radius: 4px; }
        
        .header { background: #ccc; display: inline-block; padding: 5px 10px; margin-bottom: 20px; font-weight: bold; }
        
        .game-area { display: flex; gap: 20px; margin-bottom: 30px; min-height: 300px; }
        
        /* Drop Zones */
        .column { flex: 1; display: flex; flex-direction: column; }
        .column-header { background: #bbb; padding: 5px 10px; font-weight: bold; }
        .drop-zone { flex-grow: 1; background: var(--bg); border: 1px solid #ddd; padding: 10px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; }
        
        /* Items */
        .vowel-bank { flex: 0.8; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; }
        .draggable { 
            width: 60px; height: 60px; background: #ddd; border: 1px solid #bbb; 
            border-radius: 4px; display: flex; align-items: center; justify-content: center; 
            font-size: 1.5rem; cursor: grab; box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .draggable:active { cursor: grabbing; }

        /* UI */
        #check-btn { background: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .status-icon { font-size: 1.2rem; }
        .correct { border: 2px solid #28a745 !important; background: #d4edda !important; }
        .wrong { border: 2px solid #dc3545 !important; background: #f8d7da !important; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">Sort the long and short vowels</div>

    <div class="game-area">
        <div class="column">
            <div class="column-header">Short vowels</div>
            <div class="drop-zone" id="short-zone" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        
        <div class="column">
            <div class="column-header">Long Vowels</div>
            <div class="drop-zone" id="long-zone" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>

        <div class="vowel-bank" id="bank" ondrop="drop(event)" ondragover="allowDrop(event)">
            <!-- Vowels generated by JS -->
        </div>
    </div>

    <button id="check-btn" onclick="validate()">
        <span class="status-icon">✔</span> Check
    </button>
</div>

<script>
    const vowels = [
        { char: "அ", type: "short" }, { char: "ஆ", type: "long" },
        { char: "இ", type: "short" }, { char: "ஈ", type: "long" },
        { char: "உ", type: "short" }, { char: "ஊ", type: "long" },
        { char: "எ", type: "short" }, { char: "ஏ", type: "long" },
        { char: "ஐ", type: "long" },  { char: "ஒ", type: "short" },
        { char: "ஓ", type: "long" },  { char: "ஔ", type: "long" }
    ];

    const bank = document.getElementById('bank');

    // Initialize and Shuffle
    [...vowels].sort(() => Math.random() - 0.5).forEach((v, i) => {
        const el = document.createElement('div');
        el.className = 'draggable';
        el.draggable = true;
        el.id = `v-${i}`;
        el.innerText = v.char;
        el.dataset.type = v.type;
        el.ondragstart = (e) => e.dataTransfer.setData("text", e.target.id);
        bank.appendChild(el);
    });

    function allowDrop(e) { e.preventDefault(); }

    function drop(e) {
        e.preventDefault();
        const id = e.dataTransfer.getData("text");
        const draggableElement = document.getElementById(id);
        const dropzone = e.target.closest('.drop-zone') || e.target.closest('.vowel-bank');
        
        if (dropzone) {
            dropzone.appendChild(draggableElement);
            draggableElement.classList.remove('correct', 'wrong');
        }
    }

    function validate() {
        document.querySelectorAll('.draggable').forEach(el => {
            const parentId = el.parentElement.id;
            const type = el.dataset.type;

            if (parentId === 'bank') {
                el.classList.remove('correct', 'wrong');
            } else if ((type === 'short' && parentId === 'short-zone') || 
                       (type === 'long' && parentId === 'long-zone')) {
                el.classList.add('correct');
                el.classList.remove('wrong');
            } else {
                el.classList.add('wrong');
                el.classList.remove('correct');
            }
        });
    }
</script>

</body>
        </html>
